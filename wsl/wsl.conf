# Goes in /etc/wsl.conf inside the Arch WSL guest — NOT symlinked automatically by install.sh,
# since it's a root-owned system file outside $HOME. Copy it manually (see root README):
#
#   sudo cp wsl/wsl.conf /etc/wsl.conf
#
# Reference: https://wiki.archlinux.org/title/Install_Arch_Linux_on_WSL

[boot]
# Enables systemd (Arch's WSL image ships with this unset; most of this repo's tooling
# — openssh, etc. — assumes a systemd user session is available).
systemd=true

[user]
# Uncomment and set to the username created during first launch, so WSL starts you in
# that account instead of root.
# default=<your-arch-wsl-username>

[interop]
# Lets Linux processes launch Windows executables (e.g. xdg-open handing a URL to the
# Windows-side browser) and appends the Windows PATH to the Linux one.
enabled=true
appendWindowsPath=true

[automount]
enabled=true
options = "metadata,umask=22,fmask=11"
