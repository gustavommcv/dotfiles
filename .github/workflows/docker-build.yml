name: Build docker-alpine image

on:
  push:
    branches: [docker-alpine]
    paths:
      - Dockerfile
      - entrypoint.sh
      - dev
      - zsh/.zshrc
      - tmux/.tmux.conf
      - .github/workflows/docker-build.yml
  schedule:
    # Weekly, so the image periodically re-pulls minimal-neovim@main and stays
    # current even when nothing in this repo itself changed.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: docker-alpine-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dotfiles-docker-alpine

jobs:
  build:
    runs-on: ubuntu-latest
    # The headless Neovim bootstrap in the Dockerfile has one theoretical hang
    # risk (lazy.nvim's bootstrap calls vim.fn.getchar() if its own git clone
    # fails, which blocks forever without a TTY) — fail the job instead of
    # burning Actions minutes indefinitely if that's ever hit.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
